name: CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

# Restrict GITHUB_TOKEN to the minimum needed for GHCR pushes + checkout.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: indra-619
  IMAGE_NAME: court-line

jobs:
  build-and-push:
    name: ${{ matrix.image }} image
    runs-on: ubuntu-latest

    # matrix.image matches the docker-compose service name; the image is
    # published as ghcr.io/<IMAGE_OWNER>/<IMAGE_NAME>/<image>.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
            dockerfile: backend/Dockerfile
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}/${{ matrix.image }}
          # Always tag with the short SHA; on a vX.Y.Z tag push also publish
          # the version, the version+sha, and "latest" (main never promotes latest).
          tags: |
            type=sha,format=short
            type=match,pattern=v(.*),group=1
            type=match,pattern=v(.*),group=1,suffix=-sha
            # `flavor: latest=auto` below promotes matching semver tags
            # (incl. tag-driven builds) to `latest`; main pushes keep only
            # the SHA tag, since they never match the vX.Y.Z pattern.
          flavor: |
            latest=auto
          # Bake common provenance/labels into every tag produced.
          labels: |
            org.opencontainers.image.title=court-line-${{ matrix.image }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false
