# Issue template chooser — shown when a user opens a new issue.
# Keep this short; long content lives in the linked templates.

blank_issues_enabled: false
contact_links:
  - name: Security advisory (private)
    url: https://github.com/Indra-619/court-line/security/advisories/new
    about: Report a vulnerability privately. Do not file public
      details for unpatched issues.
  - name: Documentation
    url: https://github.com/Indra-619/court-line#readme
    about: README, CONTRIBUTING.md, and docs/ first.
  - name: Discussions
    url: https://github.com/Indra-619/court-line/discussions
    about: Open-ended questions, ideas, and show-and-tell.